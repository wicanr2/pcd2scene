name: ci
# 第三方 action 以 commit SHA 固定，註解記錄對應的版本與 Node.js 執行環境。升級時用
# gh api repos/<owner>/<repo>/commits/<tag> --jq .sha 查 SHA，並確認 action.yml 的 runs.using。
on:
  push:
  pull_request:
jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - name: harness (docker)
        run: harness/run.sh --docker all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, node24
        if: always()
        with:
          name: out-docker
          path: |
            out/harness-summary.json
            out/*/scene/report.json
            out/*/scene/accept.json
            out/*/scene/preview.png
            out/*/scene/overview.svg
            out/*/scene/stages/
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, node24
        with:
          python-version: "3.12"
      - name: harness (native)
        run: harness/run.sh --native all
