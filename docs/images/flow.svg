<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="530" viewBox="0 0 1060 530" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, WenQuanYi Zen Hei, sans-serif" font-size="14" fill="#222">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1060" height="530" fill="#fff"/>
  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <!-- synth 產生三個檔 -->
    <path d="M120,76 L120,118"/>
    <path d="M28,48 L12,48 L12,225 L18,225"/>
    <path d="M12,225 L12,455 L18,455"/>
    <!-- 輸入到 build -->
    <path d="M222,145 L278,145"/>
    <path d="M222,225 L278,225"/>
    <!-- build 到輸出 -->
    <path d="M502,280 L568,280"/>
    <!-- 輸出到後續指令 -->
    <path d="M792,135 L868,135"/>
    <path d="M792,215 L868,215"/>
    <path d="M792,305 L868,305"/>
    <path d="M792,405 L868,405"/>
    <!-- 真值與驗收規格 -->
    <path d="M222,455 L240,455 L240,500 L840,500 L840,325 L868,325"/>
    <path d="M950,472 L950,432"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="830" y="128">scene.usda</text>
    <text x="830" y="208">scene.json</text>
    <text x="830" y="298">scene.json</text>
    <text x="830" y="398">整個目錄</text>
    <text x="540" y="494">truth.json</text>
  </g>

  <!-- 第一欄：輸入 -->
  <rect x="28" y="20" width="194" height="56" rx="6" fill="#eceff1" stroke="#555"/>
  <text x="125" y="44" text-anchor="middle" font-weight="bold">pcd2scene synth</text>
  <text x="125" y="64" text-anchor="middle" font-size="12">產生合成點雲與真值</text>

  <rect x="20" y="120" width="202" height="50" rx="6" fill="#e3f2fd" stroke="#1e6fb8"/>
  <text x="121" y="142" text-anchor="middle" font-weight="bold">點雲</text>
  <text x="121" y="161" text-anchor="middle" font-size="12">.pcd、.ply</text>

  <rect x="20" y="200" width="202" height="50" rx="6" fill="#e3f2fd" stroke="#1e6fb8"/>
  <text x="121" y="222" text-anchor="middle" font-weight="bold">config.yaml</text>
  <text x="121" y="241" text-anchor="middle" font-size="12">參數與物件目錄</text>

  <rect x="20" y="432" width="202" height="46" rx="6" fill="#e3f2fd" stroke="#1e6fb8"/>
  <text x="121" y="452" text-anchor="middle" font-weight="bold">truth.json</text>
  <text x="121" y="469" text-anchor="middle" font-size="12">真值（只有合成資料）</text>

  <!-- 第二欄：build -->
  <rect x="280" y="110" width="222" height="342" rx="8" fill="#fff3e0" stroke="#c26a00"/>
  <text x="391" y="138" text-anchor="middle" font-weight="bold">pcd2scene build</text>
  <g font-size="13">
    <text x="298" y="170">1　讀檔、轉換、裁切</text>
    <text x="298" y="197">2　體素平均</text>
    <text x="298" y="224">3　地面、天花板、轉正</text>
    <text x="298" y="251">4　牆</text>
    <text x="298" y="278">5　地面板</text>
    <text x="298" y="305">6　分群</text>
    <text x="298" y="332">7　比對物件目錄</text>
    <text x="298" y="359">8　殘餘網格</text>
    <text x="298" y="386">9　寫 scene.json</text>
    <text x="298" y="413">10 匯出 URDF、SDF、USD</text>
  </g>
  <text x="391" y="440" text-anchor="middle" font-size="12" fill="#555">加 --stages 時每步畫一張圖</text>

  <!-- 第三欄：輸出目錄 -->
  <rect x="570" y="110" width="222" height="342" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="681" y="138" text-anchor="middle" font-weight="bold">輸出目錄 OUT/</text>
  <g font-size="13">
    <text x="588" y="170">scene.json　場景描述</text>
    <text x="588" y="197">scene.urdf</text>
    <text x="588" y="224">scene.sdf</text>
    <text x="588" y="251">scene.usda</text>
    <text x="588" y="278">meshes/residual.stl</text>
    <text x="588" y="305">report.json　品質指標</text>
    <text x="588" y="332">overview.svg、preview.png</text>
    <text x="588" y="359">config.resolved.json</text>
    <text x="588" y="386">stages/　各步驟的圖</text>
  </g>

  <!-- 第四欄：後續指令 -->
  <rect x="870" y="110" width="172" height="50" rx="6" fill="#eceff1" stroke="#555"/>
  <text x="956" y="132" text-anchor="middle" font-weight="bold">pcd2scene view</text>
  <text x="956" y="151" text-anchor="middle" font-size="12">讀回畫成 PNG</text>

  <rect x="870" y="190" width="172" height="50" rx="6" fill="#eceff1" stroke="#555"/>
  <text x="956" y="212" text-anchor="middle" font-weight="bold">pcd2scene export</text>
  <text x="956" y="231" text-anchor="middle" font-size="12">換座標或格式重新匯出</text>

  <rect x="870" y="290" width="172" height="50" rx="6" fill="#eceff1" stroke="#555"/>
  <text x="956" y="312" text-anchor="middle" font-weight="bold">pcd2scene compare</text>
  <text x="956" y="331" text-anchor="middle" font-size="12">對真值，寫 compare.json</text>

  <rect x="870" y="380" width="172" height="50" rx="6" fill="#eceff1" stroke="#555"/>
  <text x="956" y="402" text-anchor="middle" font-weight="bold">pcd2scene accept</text>
  <text x="956" y="421" text-anchor="middle" font-size="12">逐條驗收，寫 accept.json</text>

  <rect x="870" y="474" width="172" height="44" rx="6" fill="#e3f2fd" stroke="#1e6fb8"/>
  <text x="956" y="494" text-anchor="middle" font-weight="bold" font-size="13">accept.json</text>
  <text x="956" y="510" text-anchor="middle" font-size="11">examples/&lt;範例&gt;/ 的驗收規格</text>
</svg>
